<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Torta de Limão</title>
</head>

<body>

    <header>
        <h1>Torta de Limão</h1>
        <p>Uma receita clássica, fácil e deliciosa 🍋</p>
    </header>

    <section>

        <h2>Ingredientes</h2>
        <ul>
            <li>1 pacote de biscoito maisena (200g)</li>
            <li>100g de manteiga derretida</li>
            <li>1 lata de leite condensado</li>
            <li>Suco de 2 limões</li>
            <li>1 lata de creme de leite</li>
            <li>Raspas de limão a gosto</li>
        </ul>
    </section>
</body>


</html>
